# DSH Test Workbench — 测试专用 Agent 组合
#
# 使用方式:
#   dsh --profile .
#   或复制到 ~/.dsh/profiles/test-workbench/

# === LLM 配置 ===

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKey: ${DEEPSEEK_API_KEY}
    baseUrl: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}

# === 视觉路由（有图片时切到多模态模型）===

- id: vision-router
  plugin: dsh-llm-vision-router
  config:
    visionProvider: openai
    visionModel: gpt-4o-mini
    toolResultsOnly: true
    verbose: false

# === UI 操作与验证 ===

- id: app-verify
  plugin: dsh-tool-app-verify
  config:
    mode: browser
    headless: true
    timeout: 30000
    baselinePath: ./baselines
    diffThreshold: 0.1
    viewport:
      width: 1280
      height: 720

# === 会话质量分析 ===

- id: session-analyst
  plugin: dsh-session-analyst
  config:
    redundantCallThreshold: 3
    excessiveStepThreshold: 10
