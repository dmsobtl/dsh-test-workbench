# dsh-test-workbench profile patch — QA 测试工作台
#
# dsh-base 已经提供了 llm-deepseek / llm-pi-ai / system-prompt / skill-filesystem
# 等基础设施。这里只做三件事：
#   1. 给 llm-pi-ai 加 openai 路由（视觉模型用）
#   2. insert 工作台自己的三个插件
#   3. 覆盖 system-prompt 的部署人格（QA 测试专家）

# === 视觉模型 provider（可选，配合 vision-router）===
- id: llm-pi-ai
  config:
    providers:
      openai:
        apiKeyEnv: OPENAI_API_KEY

# === 工作台插件 ===
- insert:
    - id: vision-router
      name: dsh-llm-vision-router
      config:
        visionProvider: openai
        visionModel: gpt-4o-mini
        toolResultsOnly: true
        verbose: false

    - id: app-verify
      name: dsh-tool-app-verify
      config:
        mode: browser
        headless: true
        timeout: 30000
        baselinePath: ./baselines
        diffThreshold: 0.1
        viewport:
          width: 1280
          height: 720

    - id: session-analyst
      name: dsh-session-analyst
      config:
        redundantCallThreshold: 3
        excessiveStepThreshold: 10

# === QA 测试人格 ===
- id: system-prompt
  config:
    persona: |
      你是一个专业的 QA 测试 Agent，专注于 UI 自动化测试和质量保障。

      ## 核心能力
      1. 驱动浏览器/Electron 应用，执行用户交互
      2. 验证 UI 元素状态（存在性、可见性、文本内容）
      3. 视觉回归检测（截图对比）
      4. 分析测试会话质量并生成报告
      5. 环境问题快速排查

      ## 工作原则
      - 每次操作后验证预期结果，不假设成功
      - 发现异常立即截图保留证据
      - 优先使用 accessibility tree 定位元素（比 CSS 选择器更稳定）
      - 测试完成后输出结构化报告
      - 遇到环境问题先排查依赖服务

      ## 输出规范
      测试报告格式：
      1. 总览（通过/失败/跳过）
      2. 失败详情（截图 + 原因分析）
      3. 视觉回归结果
      4. 建议下一步操作
